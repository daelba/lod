[project]
name = "lod"
version = "0.2.1"
description = "Shared utilities for Wikibase and endpoint handling"
authors = [{ name = "Daniel Baránek" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
wikibase = [
  "pywikibot>=9.3.0",
]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lod"]

[tool.setuptools.package-data]
lod = ["default_endpoints.json"]
