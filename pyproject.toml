[project]
name = "lod"
version = "0.1.0"
description = "Shared utilities for Wikibase and endpoint handling"
authors = [{ name = "Daniel Baránek" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pywikibot>=9.3.0",
  "SPARQLWrapper>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lod"]
